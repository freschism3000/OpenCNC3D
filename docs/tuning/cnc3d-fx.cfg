# CNC3D Tier 2 presentation: THE TUNED DIAL SET, and now also the shipped defaults.
# Re-recorded, evening. It replaces the 19 Aug set that used to live here.
#
# WHAT THIS IS, AND WHAT CHANGED ON 20 AUGUST
#   These are the numbers set by eye through the F5 panel, and as of the same
#   evening they are ALSO what game/fx_state.h's fx_defaults() compiles in. They are
#   no longer a file the picture depends on. Unzip either platform's build and this
#   is the picture, with no cfg present anywhere.
#
#   That is the reverse of what this file's previous header said, and the reversal is
#   the point rather than an accident. Before, the tracked copy was the only trustworthy
#   record of a judgement that existed nowhere else; the code shipped a DIFFERENT
#   picture (sun 315/52, gamma 0.62, bloom 0.55, 2x supersampling) and neither platform
#   had ever shown a project decision. Baking the numbers in is what closed the Mac/Windows split
#   and what he reported as Windows putting shadows in the wrong place.
#
#   The 19 Aug set that used to be here (sun 77.14 / 33.0, nineteen dials moved) is
#   SUPERSEDED. This newer set was chosen once it was clear two files existed:
#   this one is 67.5 / 28.71 with thirty-four dials moved off the pre-tuning values.
#   The older numbers survive in git history and as a known gap, which carries the
#   account of how the two came to disagree.
#
# IT IS A RECORD, NOT A SOURCE, AND IT MUST NOT DRIFT
#   fx_defaults() is where the picture comes from. This file exists so a human can read
#   the same numbers without a compiler, and so the next tuning session has something to
#   diff against. Proved identical the day it was written: the renderer's own writer was
#   asked to dump its compiled defaults and the result matched this file on all SIXTY-ONE
#   dials, with ZERO lines carrying a "# was" annotation, which is the panel's own way
#   of saying nothing is off its shipped value. The one deliberate difference is the
#   line below it: see MASTER.
#
#   If the dials change again, change fx_defaults() and re-dump this file from the
#   binary. Do not hand-edit one of the two.
#
# A SIXTY-FIRST DIAL, added `smooth_anim`, the "Smooth animations"
#   checkbox on the Visuals page. On by default, at a project request. It is not a post
#   pass and not under the master switch; it is the sub-tick interpolation of movement,
#   mesh keyframes and structure stages. Off gives the original stepped presentation.
#
# ONE LINE HERE DIFFERS FROM THE COMPILED DEFAULT, ON PURPOSE
#   `enabled 1`, where fx_defaults() ships 0. The chain's master switch stays off in the
#   compiled defaults so the verification suite measures the shipped picture, and the
#   GAME turns it on for itself at startup (game_visuals_default_enhanced). Keeping it 1
#   here is what makes this file still work as `cnc3d --gfx docs/tuning/cnc3d-fx.cfg`.
#
# THE SUN IN HERE IS NOT THE CARTRIDGE'S, AND THAT IS A DECISION
#   The ROM's own light is 45.0 azimuth / 35.264 elevation. This is 67.5 / 28.71, which
#   is 20.12 degrees off it. The cartridge's number was known and this was chosen anyway.
#   A deliberate deviation, recorded as such. Do not "correct" it back.
#

# ---- MASTER
bilinear           1
smooth_anim        1
enabled            1

# ---- 1  VI OUTPUT GAMMA  (decoded)
gamma_on           0
gamma              1.00000

# ---- 2  SUPERSAMPLING
ss_scale           1.00000

